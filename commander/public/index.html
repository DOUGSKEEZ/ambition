<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>commander — Company Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%AD%90%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">⚡️ Ambition CRM</div>
    <div class="page-title">
      <div class="pt-name">⭐ COMMANDER</div>
      <div class="pt-desc">Company intelligence</div>
    </div>
    <div class="header-right">
      <a id="link-sniper" class="linkbtn" target="_blank" rel="noopener"><img class="ico" src="icons/sniper-20.png" alt="" /> Sniper ↗</a>
      <a id="link-medic" class="linkbtn" target="_blank" rel="noopener"><img class="ico" src="icons/meddic-20.png" alt="" /> Meddic ↗</a>
      <a id="link-engineer" class="linkbtn" target="_blank" rel="noopener"><img class="ico" src="icons/wrench.png" alt="" /> Engineer ↗</a>
      <a id="link-specops" class="linkbtn" target="_blank" rel="noopener"><img class="ico" src="icons/shield.png" alt="" /> SpecOps ↗</a>
      <a id="link-uav" class="linkbtn" target="_blank" rel="noopener"><img class="ico" src="icons/uav-20.svg" alt="" /> UAV ↗</a>
      <a id="link-support" class="linkbtn" target="_blank" rel="noopener">🛡️ Support ↗</a>
      <button id="theme-toggle" title="Toggle light/dark">🌙</button>
    </div>
  </header>

  <main id="app"><!-- dashboard / company view rendered here --></main>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
